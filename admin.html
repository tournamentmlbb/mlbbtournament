<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Faustinorex MLBB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #06090e;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Secret Unlock Box */
    .login-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .login-box h2 {
      margin-bottom: 15px;
      color: #ff007f;
      user-select: none;
    }

    .secret-word {
      color: #00dfd8;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      transition: transform 0.1s ease;
    }

    .secret-word:active {
      transform: scale(0.95);
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #1f6feb, #7928ca);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* Dashboard Container */
    .admin-dashboard {
      display: none;
      width: 100%;
      max-width: 950px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .dashboard-header h1 {
      color: #00dfd8;
      font-size: 1.8rem;
    }

    /* Admin Control Panel */
    .admin-controls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 25px;
      background: #0d1117;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #30363d;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .toggle-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: background 0.3s ease;
    }

    .toggle-btn.active { background-color: #238636; }
    .toggle-btn.inactive { background-color: #da3633; }

    .clear-btn {
      background-color: #da3633;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .clear-btn:hover { background-color: #f85149; }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #30363d;
    }

    th {
      background-color: #0d1117;
      color: #58a6ff;
    }

    /* Contact Summary Box */
    .contacts-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }

    .contacts-box h3 {
      color: #7928ca;
      margin-bottom: 15px;
    }

    .contact-item {
      padding: 8px 0;
      border-bottom: 1px dashed #30363d;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .error-msg {
      color: #f85149;
      font-size: 0.9rem;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-box" id="loginBox">
    <i class="fas fa-user-shield fa-3x" style="color: #7928ca; margin-bottom: 15px;"></i>
    <h2>Admin <span class="secret-word" id="secretAccessWord" onclick="registerSecretClick()">Access</span></h2>
    <p style="color: #8b949e;">Click the secret word 9 times, then click the button below.</p>
    
    <button class="btn" onclick="verifySecretUnlock()">Enter Admin Dashboard</button>
    <p id="errorMsg" class="error-msg">Access Denied!</p>
  </div>

  <div class="admin-dashboard" id="adminDashboard">
    <div class="dashboard-header">
      <h1><i class="fas fa-user-shield"></i> Tournament Control Panel</h1>
      <button class="clear-btn" onclick="resetApplications()"><i class="fas fa-trash"></i> Clear Applications</button>
    </div>

    <div class="admin-controls">
      <div>
        <strong>Registration Status: </strong>
        <span id="statusText" style="font-weight: bold;">Loading...</span>
      </div>
      <button id="toggleAppBtn" class="toggle-btn" onclick="toggleRegistration()">Toggle Status</button>
    </div>

    <h3 style="color: #58a6ff; margin-bottom: 10px;">Registered Squads</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Squad Name</th>
            <th>Captain IGN & ID</th>
            <th>Discord Tag</th>
            <th>Email</th>
            <th>Roster</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="submissionsTable">
          </tbody>
      </table>
    </div>

    <div class="contacts-box">
      <h3><i class="fas fa-address-book"></i> Captain Contacts (Email & Discord)</h3>
      <div id="contactList">
        </div>
    </div>

    <div style="margin-top: 25px; text-align: center;">
      <a href="index.html" style="color: #8b949e; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
    </div>
  </div>

  <script>
    let accessClickCount = 0;

    // Registers clicks on the word "Access"
    function registerSecretClick() {
      accessClickCount++;
    }

    // Verifies if "Access" was clicked at least 9 times before clicking the button
    function verifySecretUnlock() {
      const errorMsg = document.getElementById("errorMsg");

      if (accessClickCount >= 9) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
        loadDashboardData();
      } else {
        errorMsg.innerText = "Access Denied!";
        errorMsg.style.display = "block";
        accessClickCount = 0; // Reset count on wrong attempt
      }
    }

    function loadDashboardData() {
      loadApplications();
      updateToggleUI();
    }

    function isRegistrationOpen() {
      return localStorage.getItem("registration_open") !== "false";
    }

    function updateToggleUI() {
      const open = isRegistrationOpen();
      const statusText = document.getElementById("statusText");
      const toggleBtn = document.getElementById("toggleAppBtn");

      if (open) {
        statusText.innerText = "OPEN (Everyone can apply)";
        statusText.style.color = "#56d364";
        toggleBtn.innerText = "Turn Registration OFF";
        toggleBtn.className = "toggle-btn inactive";
      } else {
        statusText.innerText = "CLOSED ('Sorry, Today's Application Is over')";
        statusText.style.color = "#f85149";
        toggleBtn.innerText = "Turn Registration ON";
        toggleBtn.className = "toggle-btn active";
      }
    }

    function toggleRegistration() {
      const currentState = isRegistrationOpen();
      localStorage.setItem("registration_open", !currentState);
      updateToggleUI();
    }

    function loadApplications() {
      const data = JSON.parse(localStorage.getItem("tournament_applications") || "[]");
      const tableBody = document.getElementById("submissionsTable");
      const contactList = document.getElementById("contactList");
      
      tableBody.innerHTML = "";
      contactList.innerHTML = "";

      if (data.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:#8b949e;'>No team applications submitted yet.</td></tr>";
        contactList.innerHTML = "<p style='color:#8b949e;'>No contact information available.</p>";
        return;
      }

      data.forEach((app, index) => {
        const row = `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${escapeHtml(app.teamName)}</strong></td>
            <td>${escapeHtml(app.leaderIgn)}</td>
            <td>${escapeHtml(app.discordTag)}</td>
            <td>${escapeHtml(app.email)}</td>
            <td><pre style="font-family: inherit; white-space: pre-wrap; margin:0;">${escapeHtml(app.members)}</pre></td>
            <td style="font-size:0.85rem; color:#8b949e;">${app.submittedAt}</td>
          </tr>
        `;
        tableBody.innerHTML += row;

        const contactItem = `
          <div class="contact-item">
            <span><strong>${escapeHtml(app.teamName)}</strong> (${escapeHtml(app.leaderIgn)})</span>
            <span><i class="fas fa-envelope"></i> ${escapeHtml(app.email)} | <i class="fab fa-discord"></i> ${escapeHtml(app.discordTag)}</span>
          </div>
        `;
        contactList.innerHTML += contactItem;
      });
    }

    function resetApplications() {
      if (confirm("Are you sure you want to clear all 4 squad applications?")) {
        localStorage.removeItem("tournament_applications");
        localStorage.removeItem("has_applied_faustinorex");
        alert("All applications have been removed!");
        loadDashboardData();
      }
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
